name: game-server CI

on:
  push:
  pull_request:

jobs:
  build-and-unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libpqxx-dev libspdlog-dev libgtest-dev
          sudo mkdir -p /tmp/gtest-build && cd /tmp/gtest-build && sudo cmake /usr/src/googletest -DCMAKE_BUILD_TYPE=Release && sudo make -j$(nproc) && sudo make install
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
